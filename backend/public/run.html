<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>市场零件 · 手动抓取</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060a0f; --panel: #0b131b; --line: #1d2b38;
    --text: #e8f1f4; --muted: #8ba0ad; --accent: #6ee7d0; --amber: #f2b880; --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #0d1b22, var(--bg));
    color: var(--text); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 12.5px; }
  nav a.active, nav a:hover { color: var(--accent); border-color: rgba(110,231,208,.45); }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 24px 60px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar input {
    flex: 1; min-width: 0; background: #0a1219; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  button {
    background: #0e1a22; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: rgba(110,231,208,.14); border-color: rgba(110,231,208,.5); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--panel); }
  .card span { display: block; color: var(--muted); font-size: 12px; }
  .card b { font-size: 15px; font-weight: 600; }
  .panel { border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.008)); padding: 16px 18px; margin-bottom: 14px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 4px 0 12px; }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 18px; }
  .group h3 { font-size: 12px; color: var(--accent); margin: 10px 0 6px; font-family: ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  .group label { display: flex; gap: 8px; align-items: center; color: var(--muted); padding: 2px 0; font-size: 13px; cursor: pointer; }
  .group input { accent-color: #6ee7d0; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .row label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  .result { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; color: var(--muted); }
  .result strong { color: var(--text); }
  .ok { color: var(--accent); }
  .err { color: var(--danger); }
  .muted { color: var(--muted); }
  .links { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .links a { color: var(--accent); font-size: 12.5px; }
</style>
</head>
<body>
<header>
  <h1>ATLAS 市场零件 · 手动抓取</h1>
  <nav>
    <a href="#" data-nav="review">后端审核</a>
    <a href="#" data-nav="run" class="active">手动抓取</a>
    <a href="#" data-nav="inspect">后端检查</a>
  </nav>
</header>
<main>
  <div class="toolbar">
    <input id="token" type="password" placeholder="访问 token（atlas/backend/data/token.txt）" />
    <button id="save">保存 token</button>
  </div>

  <div class="cards">
    <div class="card"><span>平台 / AI</span><b id="platform">—</b></div>
    <div class="card"><span>定时任务</span><b id="schedule">—</b></div>
    <div class="card"><span>待审核</span><b id="pending">—</b></div>
    <div class="card"><span>最近一次</span><b id="last">—</b></div>
  </div>

  <section class="panel">
    <h2>选择零件类型</h2>
    <p class="hint">默认全选 28 个类型；抓取会按表1 的模块分组执行。先用 dry-run 看结果，再决定是否写回。</p>
    <div class="groups" id="groups"><p class="muted">正在读取零件类型…</p></div>
    <div class="row">
      <button id="all">全选</button>
      <button id="none">全不选</button>
      <span class="muted" id="count">0 / 0</span>
      <label><input id="dry" type="checkbox" checked /> dry-run（不写回零件表）</label>
      <button class="primary" id="start">开始抓取</button>
    </div>
  </section>

  <section class="panel">
    <h2>运行状态</h2>
    <div class="result" id="output">尚未开始。</div>
    <div class="links">
      <a id="link-page2" href="#" target="_blank" rel="noreferrer">打开第二页</a>
      <a id="link-review" href="#" target="_blank" rel="noreferrer">后端审核页</a>
      <a id="link-inspect" href="#" target="_blank" rel="noreferrer">后端检查页</a>
    </div>
  </section>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  function sanitizeToken(value) {
    const token = String(value || "").trim();
    return /^[A-Za-z0-9_-]{8,128}$/.test(token) ? token : "";
  }
  const rawToken = params.get("token") || sessionStorage.getItem("market.token") || "";
  const state = {
    token: sanitizeToken(rawToken),
    rawToken,
    partTypes: [],
    selected: new Set(),
    polling: false,
    runId: null,
  };
  const $ = (id) => document.getElementById(id);

  function withToken(path) {
    const url = new URL(path, location.origin);
    if (state.token) url.searchParams.set("token", state.token);
    return url.toString();
  }

  function headers() {
    return state.token
      ? { "Content-Type": "application/json", "x-market-token": state.token }
      : { "Content-Type": "application/json" };
  }

  async function api(path, options = {}) {
    if (!state.token) {
      throw new Error("token 为空或格式不对：请从 atlas/backend/data/token.txt 复制 32 位 token，再点“保存 token”。");
    }
    const response = await fetch(path, { ...options, headers: headers() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function updateNav() {
    for (const link of document.querySelectorAll("[data-nav]")) {
      const page = link.dataset.nav;
      link.href = withToken(`/${page}`);
    }
    $("link-review").href = withToken("/review");
    $("link-inspect").href = withToken("/inspect");
  }

  async function loadStatus() {
    const status = await api("/api/status");
    $("platform").textContent = `${status.platformTag} · ${status.ai.mode === "mock" ? "模拟 AI" : status.ai.model}`;
    $("schedule").textContent = status.schedule.enabled
      ? `每天 ${status.schedule.dailyAt}`
      : "未启用";
    $("pending").textContent = `待审 ${status.pendingReviews}`;
    const last = status.lastRun;
    $("last").textContent = last
      ? `${last.runId.slice(-4)} · 新建 ${last.totals.created} / 更新 ${last.totals.updated}`
      : "还没有运行记录";
    $("link-page2").href = status.urls.page2;
    if (status.currentRun) {
      $("output").innerHTML = `抓取进行中：<strong>${status.currentRun.runId}</strong>（${status.currentRun.trigger}）…`;
    }
    return status;
  }

  function renderGroups() {
    const groups = new Map();
    for (const part of state.partTypes) {
      if (!groups.has(part.moduleName)) groups.set(part.moduleName, []);
      groups.get(part.moduleName).push(part);
    }
    const container = $("groups");
    container.replaceChildren();
    for (const [moduleName, parts] of groups) {
      const group = document.createElement("div");
      group.className = "group";
      const title = document.createElement("h3");
      title.textContent = moduleName;
      group.append(title);
      for (const part of parts) {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = state.selected.has(part.code);
        input.addEventListener("change", () => {
          if (input.checked) state.selected.add(part.code);
          else state.selected.delete(part.code);
          updateCount();
        });
        const span = document.createElement("span");
        span.textContent = part.name;
        label.append(input, span);
        group.append(label);
      }
      container.append(group);
    }
    updateCount();
  }

  function updateCount() {
    $("count").textContent = `${state.selected.size} / ${state.partTypes.length}`;
  }

  async function loadPartTypes() {
    const data = await api("/api/part-types");
    state.partTypes = data.partTypes;
    state.selected = new Set(data.partTypes.map((part) => part.code));
    renderGroups();
  }

  function summaryText(summary) {
    const totals = summary.totals;
    const lines = [
      `<strong>${summary.runId}</strong> · ${summary.trigger} · ${summary.durationMs}ms`,
      `类型 ${summary.partTypes} · 搜索 ${totals.listings} · 过门槛 ${totals.aboveThreshold}`,
      `详情 ${totals.detailFetched} · 类型通过 ${totals.typeAccepted} · 拒绝 ${totals.typeRejected}`,
      `合并组 ${totals.groups} · 新建 ${totals.created} · 更新 ${totals.updated} · 审核 ${totals.reviewed}`,
      `异常价剔除 ${totals.outliersRemoved}`,
      summary.write.enabled ? `写回：${summary.write.backup || "完成"}` : "写回：未写（dry-run）",
    ];
    return lines.join("\n");
  }

  async function poll(runId) {
    state.polling = true;
    const started = Date.now();
    while (state.polling) {
      await new Promise((resolve) => setTimeout(resolve, 1500));
      const status = await loadStatus().catch(() => null);
      if (!status) continue;
      if (!status.currentRun) {
        const runs = await api("/api/runs").catch(() => null);
        const run = runs?.runs?.find((item) => item.runId === runId);
        if (run) {
          $("output").innerHTML = summaryText(run);
          state.polling = false;
          break;
        }
      }
      if (Date.now() - started > 10 * 60 * 1000) {
        $("output").textContent = "等待超时，请到检查页查看运行记录。";
        state.polling = false;
      }
    }
  }

  $("save").addEventListener("click", () => {
    const value = $("token").value.trim();
    state.token = sanitizeToken(value);
    if (!state.token) {
      $("output").innerHTML =
        '<span class="err">token 格式不对：应为 32 位十六进制（见 atlas/backend/data/token.txt），不要复制地址里的“…”。</span>';
      return;
    }
    sessionStorage.setItem("market.token", state.token);
    updateNav();
    loadStatus().catch(() => {});
    loadPartTypes().catch((error) => { $("groups").innerHTML = `<p class="err">${error.message}</p>`; });
  });

  $("all").addEventListener("click", () => {
    state.selected = new Set(state.partTypes.map((part) => part.code));
    renderGroups();
  });
  $("none").addEventListener("click", () => {
    state.selected.clear();
    renderGroups();
  });

  $("start").addEventListener("click", async () => {
    if (state.selected.size === 0) {
      $("output").textContent = "至少选择一个零件类型。";
      return;
    }
    $("start").disabled = true;
    try {
      const data = await api("/api/run", {
        method: "POST",
        body: JSON.stringify({
          partTypeCodes: [...state.selected],
          dryRun: $("dry").checked,
        }),
      });
      state.runId = data.runId;
      $("output").textContent = `已启动 ${data.runId}，等待结果…`;
      await poll(data.runId);
    } catch (error) {
      $("output").innerHTML = `<span class="err">${error.message}</span>`;
    } finally {
      $("start").disabled = false;
    }
  });

  const tokenInput = $("token");
  tokenInput.value = state.token || state.rawToken;
  if (state.rawToken && !state.token) {
    $("output").innerHTML =
      '<span class="err">地址里的 token 无效（常见原因：复制了文档里的“…”，或不是 32 位十六进制）。请从 atlas/backend/data/token.txt 复制后点“保存 token”。</span>';
  }
  updateNav();
  loadStatus().catch(() => {});
  loadPartTypes().catch((error) => {
    $("groups").innerHTML = `<p class="err">${error.message}</p>`;
  });
})();
</script>
</body>
</html>
