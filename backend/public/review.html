<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>市场零件 · 后台审核</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #060a0f;
    --panel: #0b131b;
    --line: #1d2b38;
    --text: #e8f1f4;
    --muted: #8ba0ad;
    --accent: #6ee7d0;
    --amber: #f2b880;
    --danger: #ff8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #0d1b22, var(--bg));
    color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
  header .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .badge { margin-left: auto; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 60px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar input {
    flex: 1; min-width: 0; background: #0a1219; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  button {
    background: #0e1a22; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer;
  }
  button.primary { background: rgba(110, 231, 208, .14); border-color: rgba(110, 231, 208, .5); color: var(--accent); }
  button.danger { color: var(--danger); border-color: rgba(255, 138, 138, .35); }
  button:disabled { opacity: .45; cursor: default; }
  .card {
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.008));
    margin-bottom: 14px;
  }
  .card-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card-head strong { font-size: 15px; }
  .card-head .stamp { margin-left: auto; color: var(--muted); font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
  .reason { color: var(--amber); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 18px; margin: 12px 0; }
  .grid div { font-size: 12.5px; color: var(--muted); }
  .grid b { display: block; color: var(--text); font-weight: 600; font-size: 13px; }
  .params { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .params span { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .links-block { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .links-block .head { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; color: var(--text); }
  .links-block .head .hint { color: var(--muted); font-size: 11.5px; }
  .links-block .head .who { color: var(--muted); font-size: 11.5px; }
  .links { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 2px; }
  .links a { color: var(--accent); font-size: 12.5px; text-decoration: none; overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; }
  .links a:hover .text { text-decoration: underline; }
  .flag {
    flex: none; font: 10.5px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .04em;
    border-radius: 4px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted);
  }
  .flag.true { color: #08211d; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .flag.false { color: var(--muted); }
  .links .none { color: var(--muted); font-size: 12.5px; }
  .rule { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .actions input {
    width: 130px; background: #0a1219; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit;
  }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .err { color: var(--danger); }
  .done { color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
  nav { display: flex; gap: 6px; }
  nav a { color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  nav a.active, nav a:hover { color: var(--accent); border-color: rgba(110, 231, 208, .45); }
  .tabs { display: flex; gap: 8px; margin: 18px 0 12px; }
  .tabs button { color: var(--muted); }
  .tabs button.active { color: var(--accent); border-color: rgba(110, 231, 208, .45); background: rgba(110, 231, 208, .08); }
  .tabs .count { color: var(--muted); font-size: 11px; margin-left: 4px; }
  table.hist { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.hist th, table.hist td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.hist th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  table.hist td.time { white-space: nowrap; color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
  table.hist td .ok { color: var(--accent); }
  table.hist td .no { color: var(--danger); }
  table.hist td .sub { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>ATLAS 市场零件 · 后端审核</h1>
  <span class="meta" id="meta">—</span>
  <span class="badge" id="pending">待审 0</span>
  <nav>
    <a href="#" data-nav="review" class="active">审核</a>
    <a href="#" data-nav="run">手动抓取</a>
    <a href="#" data-nav="inspect">检查</a>
  </nav>
</header>
<main>
  <div class="toolbar">
    <input id="token" type="password" placeholder="访问 token（首次从启动日志复制）" />
    <button id="save">保存 token</button>
    <button id="reload">刷新</button>
  </div>
  <p class="done">这里只处理“厂家+型号相同、但价格差超 30% 或参数存疑”的商品；通过后会按中位价写回零件表。审核不使用 AI，通过 / 驳回都由人决定。</p>
  <div class="tabs">
    <button id="tab-pending" class="active">待审核<span class="count" id="count-pending">0</span></button>
    <button id="tab-history">既往记录<span class="count" id="count-history">0</span></button>
  </div>
  <div id="list"></div>
  <div id="history" hidden></div>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  function sanitizeToken(value) {
    const token = String(value || "").trim();
    return /^[A-Za-z0-9_-]{8,128}$/.test(token) ? token : "";
  }
  const rawToken = params.get("token") || sessionStorage.getItem("market.token") || "";
  const state = {
    token: sanitizeToken(rawToken),
    rawToken,
    tab: "pending",
    items: [],
    counts: { pending: 0, approved: 0, rejected: 0 },
  };
  const $ = (id) => document.getElementById(id);

  function updateNav() {
    for (const link of document.querySelectorAll("[data-nav]")) {
      const url = new URL(`/${link.dataset.nav}`, location.origin);
      if (state.token) url.searchParams.set("token", state.token);
      link.href = url.toString();
    }
  }

  function headers() {
    return state.token
      ? { "Content-Type": "application/json", "x-market-token": state.token }
      : { "Content-Type": "application/json" };
  }

  async function api(path, options = {}) {
    if (!state.token) {
      throw new Error("token 为空或格式不对：请从 atlas/backend/data/token.txt 复制 32 位 token，再点“保存 token”。");
    }
    const response = await fetch(path, { ...options, headers: headers() });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function fmt(value) {
    return Number(value || 0).toLocaleString("zh-CN", { maximumFractionDigits: 2 });
  }

  function fmtTime(value) {
    if (!value) return "—";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  async function loadStatus() {
    const status = await api("/api/status");
    $("meta").textContent = `${status.platformTag} · ${status.schedule.enabled ? `每天 ${status.schedule.dailyAt}` : "定时未启用"}`;
    $("pending").textContent = `待审 ${status.pendingReviews}`;
  }

  function linkRow(link) {
    const a = document.createElement("a");
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noreferrer noopener";
    const flag = document.createElement("span");
    flag.className = `flag ${link.primary ? "true" : "false"}`;
    flag.textContent = link.primary ? "true" : "false";
    const text = document.createElement("span");
    text.className = "text";
    const bits = [];
    if (link.price !== null && link.price !== undefined) bits.push(`¥${fmt(link.price)}`);
    if (link.monthlySales !== null && link.monthlySales !== undefined) bits.push(`月销 ${fmt(link.monthlySales)}`);
    if (link.shop) bits.push(link.shop);
    if (link.primary) bits.push("主链接");
    text.textContent = bits.join(" · ") || link.url;
    a.append(flag, text);
    return a;
  }

  function linksBlock(title, hint, who, links, emptyText) {
    const block = document.createElement("div");
    block.className = "links-block";
    const head = document.createElement("div");
    head.className = "head";
    const strong = document.createElement("strong");
    strong.textContent = title;
    head.append(strong);
    if (who) {
      const span = document.createElement("span");
      span.className = "who";
      span.textContent = who;
      head.append(span);
    }
    if (hint) {
      const span = document.createElement("span");
      span.className = "hint";
      span.textContent = hint;
      head.append(span);
    }
    block.append(head);

    const box = document.createElement("div");
    box.className = "links";
    if (links.length === 0) {
      const none = document.createElement("span");
      none.className = "none";
      none.textContent = emptyText || "—";
      box.append(none);
    } else {
      for (const link of links) box.append(linkRow(link));
    }
    block.append(box);
    return block;
  }

  function card(item) {
    const wrap = document.createElement("section");
    wrap.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";
    head.innerHTML = `<strong>${item.partTypeName || item.partTypeCode}</strong>
      <span class="pill">${item.group?.manufacturer || "?"} · ${item.group?.model || "?"}</span>
      <span class="reason">${item.reason || ""}</span>
      <span class="stamp">${fmtTime(item.createdAt)}</span>`;
    wrap.append(head);

    const grid = document.createElement("div");
    grid.className = "grid";
    grid.innerHTML = `
      <div>中位价<b>¥ ${fmt(item.group?.medianPrice)}</b></div>
      <div>保留报价<b>${item.group?.listings?.length ?? 0} 条</b></div>
      <div>现有价格<b>${item.match ? `¥ ${fmt(item.match.price)}` : "无（新商品）"}</b></div>
      <div>现有型号<b>${item.currentVariant?.name || item.match?.name || "—"}</b></div>`;
    wrap.append(grid);

    const params = document.createElement("div");
    params.className = "params";
    for (const param of item.group?.params || []) {
      const span = document.createElement("span");
      span.textContent = `${param.label}：${param.value}`;
      params.append(span);
    }
    wrap.append(params);

    const current = Array.isArray(item.currentLinks) ? item.currentLinks : [];
    const currentWho = item.currentVariant
      ? `${item.currentVariant.manufacturer || "?"} · ${item.currentVariant.model || "?"} · ¥${fmt(item.currentVariant.price)}`
      : "";
    wrap.append(
      linksBlock(
        "当前产品（表内）",
        `1 条 true + 至多 3 条 false`,
        currentWho,
        current,
        item.match ? "表内还没有链接记录" : "无（新商品）",
      ),
    );
    wrap.append(
      linksBlock(
        "本次抓取（待写入）",
        "主链接取最接近中位价的一条",
        "",
        item.group?.links || [],
        "没有可用链接",
      ),
    );

    const rule = document.createElement("p");
    rule.className = "rule";
    rule.textContent =
      "链接规则：每个产品保留 1 条 primary=true 主链接 + 至多 3 条 primary=false 备选链接；地址按归一化结果去重，重复的不会写入。";
    wrap.append(rule);

    const actions = document.createElement("div");
    actions.className = "actions";
    const price = document.createElement("input");
    price.type = "number";
    price.step = "0.01";
    price.value = item.group?.medianPrice ?? "";
    price.title = "写回价格";

    const approve = document.createElement("button");
    approve.className = "primary";
    approve.textContent = item.match ? "通过并更新价格" : "通过并新建型号";
    approve.addEventListener("click", async () => {
      approve.disabled = true;
      try {
        await api(`/api/review/${encodeURIComponent(item.id)}/approve`, {
          method: "POST",
          body: JSON.stringify({ price: Number(price.value) }),
        });
        await refresh();
      } catch (error) {
        alert(error.message);
        approve.disabled = false;
      }
    });

    const reject = document.createElement("button");
    reject.className = "danger";
    reject.textContent = "驳回";
    reject.addEventListener("click", async () => {
      const note = prompt("驳回原因（可留空）", "") ?? null;
      if (note === null) return;
      reject.disabled = true;
      try {
        await api(`/api/review/${encodeURIComponent(item.id)}/reject`, {
          method: "POST",
          body: JSON.stringify({ note }),
        });
        await refresh();
      } catch (error) {
        alert(error.message);
        reject.disabled = false;
      }
    });

    actions.append(price, approve, reject);
    wrap.append(actions);
    return wrap;
  }

  function renderPending() {
    const list = $("list");
    const pending = state.items
      .filter((item) => item.status === "pending")
      .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    if (pending.length === 0) {
      list.innerHTML = '<div class="empty">没有待审核的商品。</div>';
      return;
    }
    list.replaceChildren(...pending.map(card));
  }

  function renderHistory() {
    const box = $("history");
    const decided = state.items
      .filter((item) => item.status === "approved" || item.status === "rejected")
      .sort((a, b) => String(b.decidedAt).localeCompare(String(a.decidedAt)));
    box.replaceChildren();
    if (decided.length === 0) {
      box.innerHTML = '<div class="empty">还没有既往审核记录。通过或驳回之后，这里会留下时间、价格和说明。</div>';
      return;
    }
    const table = document.createElement("table");
    table.className = "hist";
    table.innerHTML =
      "<thead><tr><th>决定时间</th><th>结果</th><th>零件类型</th><th>厂家 / 型号</th><th>写入价格</th><th>说明</th><th>runId</th></tr></thead>";
    const tbody = document.createElement("tbody");
    for (const item of decided) {
      const tr = document.createElement("tr");
      const time = document.createElement("td");
      time.className = "time";
      time.textContent = fmtTime(item.decidedAt);
      tr.append(time);

      const result = document.createElement("td");
      const span = document.createElement("span");
      span.className = item.status === "approved" ? "ok" : "no";
      span.textContent = item.status === "approved" ? "通过" : "驳回";
      result.append(span);
      tr.append(result);

      for (const value of [
        item.partTypeName || item.partTypeCode,
        `${item.group?.manufacturer || "?"} / ${item.group?.model || "?"}`,
        item.status === "approved"
          ? item.decidedPrice !== undefined
            ? `¥ ${fmt(item.decidedPrice)}`
            : "—"
          : "未写入",
      ]) {
        const td = document.createElement("td");
        td.textContent = value;
        tr.append(td);
      }

      const note = document.createElement("td");
      const reason = document.createElement("div");
      reason.textContent = item.reason || "";
      note.append(reason);
      if (item.note) {
        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = `备注：${item.note}`;
        note.append(sub);
      }
      tr.append(note);

      const run = document.createElement("td");
      run.className = "time";
      run.textContent = item.runId || "—";
      tr.append(run);
      tbody.append(tr);
    }
    table.append(tbody);
    box.append(table);
  }

  function render() {
    $("tab-pending").classList.toggle("active", state.tab === "pending");
    $("tab-history").classList.toggle("active", state.tab === "history");
    $("count-pending").textContent = state.counts.pending || 0;
    $("count-history").textContent = (state.counts.approved || 0) + (state.counts.rejected || 0);
    $("list").hidden = state.tab !== "pending";
    $("history").hidden = state.tab !== "history";
    if (state.tab === "pending") renderPending();
    else renderHistory();
  }

  async function refresh() {
    const tokenInput = $("token");
    tokenInput.value = state.token || state.rawToken;
    updateNav();
    if (!state.token) {
      $("list").innerHTML =
        '<div class="empty err">地址里的 token 无效（常见原因：复制了文档里的“…”，或不是 32 位十六进制）。请从 atlas/backend/data/token.txt 复制后点“保存 token”。</div>';
      return;
    }
    try {
      const data = await api("/api/review");
      state.items = data.items || [];
      state.counts = data.counts || state.counts;
      render();
      await loadStatus();
    } catch (error) {
      $("list").innerHTML = `<div class="empty err">${error.message}</div>`;
    }
  }

  $("save").addEventListener("click", () => {
    const value = $("token").value.trim();
    state.token = sanitizeToken(value);
    if (!state.token) {
      $("list").innerHTML =
        '<div class="empty err">token 格式不对：应为 32 位十六进制（见 atlas/backend/data/token.txt）。</div>';
      return;
    }
    state.rawToken = state.token;
    sessionStorage.setItem("market.token", state.token);
    refresh();
  });
  $("tab-pending").addEventListener("click", () => {
    state.tab = "pending";
    render();
  });
  $("tab-history").addEventListener("click", () => {
    state.tab = "history";
    render();
  });
  $("reload").addEventListener("click", refresh);
  updateNav();
  refresh();
})();
</script>
</body>
</html>
